<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create profile · TMP Check</title>
<link rel="icon" href="/static/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/portal.css">
</head>
<body>
<main class="login-wrap">
  <form class="login-card" method="post" action="/signup">
    <div class="login-brand"><img src="/static/img/logo-mark.svg" alt="" width="52" height="28"> TMP Check</div>
    <h1>Create your reviewer profile</h1>
    <p class="muted small">Pilot preview — invited reviewers only. Upload historical or anonymised TMPs only.</p>
    {% if error %}<div class="alert error" style="margin:12px 0 0">{{ error }}</div>{% endif %}
    <label for="invite">Invite code</label>
    <input id="invite" name="invite" value="{{ invite }}" required autocomplete="off">
    <label for="name">Full name</label>
    <input id="name" name="name" required autocomplete="name">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Password (at least 10 characters)</label>
    <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password">
    <fieldset style="border:0;padding:0;margin:12px 0 0">
      <legend class="small"><strong>Traffic management accreditation</strong></legend>
      <label for="level">Accreditation level (e.g. AWTM)</label>
      <input id="level" name="level" required>
      <label for="number">Accreditation number</label>
      <input id="number" name="number" required>
      <label for="expiry">Expiry date</label>
      <input id="expiry" name="expiry" type="date" required>
    </fieldset>
    <button class="btn orange" type="submit">Create profile</button>
    <p class="muted small" style="margin-top:12px">Already have a profile? <a href="/login">Sign in</a></p>
  </form>
</main>
</body>
</html>
