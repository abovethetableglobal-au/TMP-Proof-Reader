<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · TMP Check</title>
<link rel="icon" href="/static/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/portal.css?v={{ asset_v() }}">
</head>
<body>
<main class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <div class="login-brand"><img src="/static/img/logo-mark.svg" alt="" width="52" height="28"> TMP Check</div>
    <h1>Sign in</h1>
    <p class="muted small">{{ cfg().branding.tagline }}</p>
    {% if error %}<div class="alert error" style="margin:12px 0 0">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn orange" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
