# TMP Check customer portal configuration.
# Prices and tax are configuration, never literals in code (CLAUDE.md §5).
# Source of truth for prices: COMMERCIAL_MODEL.md / DECISIONS A-04, A-31 to A-33, A-44.

currency: AUD

tax:
  gst_registered: false      # A-04 — Owner advice 2026-11-20
  gst_rate: 0.10             # applied only if gst_registered: true
  price_display: "excl"      # never label prices "GST-inclusive" while unregistered

subscription:
  sku: SUB-MONTHLY
  name: Monthly subscription
  price: 49.95
  interval: month
  note: Platform access only. Checking credits are purchased separately.

credit_products:
  - sku: CR-1
    name: Single TMP check
    credits: 1
    price: 349.00            # A-32
    offered: true
  - sku: CR-5
    name: Five-credit pack
    credits: 5
    price: 1657.75           # A-32: 5% discount
    offered: true
  - sku: CR-10
    name: Ten-credit pack
    credits: 10
    price: 3141.00           # A-32: 10% discount
    offered: true

credits:
  validity_months: 12        # A-05 rule 7

# Payments are not enabled before Gate 5 (A-09). Stripe account approved (A-45); integration after G5.
# Purchase buttons raise a
# credit request; an administrator records the ledger purchase after payment.
payments_enabled: false

# A-46 Option A: Stripe sandbox build (account acct_1UfZfBGdViWULINo "TMP Proof Reader").
# Test mode only. Key from env STRIPE_SECRET_KEY (sk_test_ only); webhook secret from env STRIPE_WEBHOOK_SECRET.
# Live mode stays off until G5 (A-09); live keys and live-mode events are refused.
stripe:
  mode: test
  sandbox_enabled: true

upload:
  allowed_extensions: [".pdf", ".docx"]
  max_bytes: 20971520        # 20 MB
  max_total_pages: 100       # A-26 (amends A-10): one total limit, drawings included

ai:
  runs: 2                    # BENCH-04: AI passes run twice per check and results are combined (max 3)

branding:
  product: TMP Check
  tagline: "Check • Comply • Confident"
  headline_line1: "Professional TMP Checking."
  headline_line2: "Fast. Thorough. Evidence-based."   # A-22
  footer_left: "Secure. Confidential. Australian Owned."
  footer_right: "Smarter TMP Checking for a Safer Tomorrow"
