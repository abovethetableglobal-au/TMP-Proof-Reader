# Primary source: Austroads, Guide to Temporary Traffic Management Part 2: Traffic Management Planning,
#   AGTTM02-26, Edition 1.2 (26 May 2026), Appendix B, Table B.1 "List of common issues and associated risks", pp 51–53.
#   Copy supplied by Owner 2026-11-24 (free public download). Items paraphrased, not reproduced.
#   EDITION CAVEAT (COMPLIANCE_REGISTER VC-01): WA Code (Mar 2026) adopts AGTTM Ed 1.1 (2021), not Ed 1.2.
