rule_id: WA-COP-4.2.3-001
source_id: SRC-WA-COP
source_name: Traffic Management for Works on Roads Code of Practice
source_url: https://www.mainroads.wa.gov.au/globalassets/technical-commercial/working-on-roads/traffic-management/traffic-management-for-works-on-roads-code-of-practice.pdf
edition: March 2026
publication_date: 2026-03
jurisdiction: WA
authority: Main Roads WA
clause: §4.2.3 (p29–30)
requirement_plain: 'If the TMP involves ''complex traffic arrangements'' (any of triggers i–ix, e.g. residual risk
  H, multilane lane closure on ≥90 km/h road with ≥15,000 vpd, works at permanent signals affecting function or
  lanes within 30 m, temporary road safety barriers, contra-flow), it must be reviewed and endorsed by an RTM: signature,
  date, printed name, RTM number. Endorsement covers the whole TMP.'
applicability: TMPs meeting any §4.2.3 trigger
evidence_required:
- Trigger facts (risk rating, road type, speed, volume, signals, barriers) + RTM endorsement block
check_method: cross-reference
expected_result: Where any trigger is met, RTM endorsement complete
category: E
default_severity: Critical
