clause: §8.3 (p101)
requirement_plain: If the TMP allows road workers (≥12 months' experience) to implement signs under direct BWTM
  supervision, the works must be on local roads with a permanent speed limit ≤50 km/h and <15,000 vpd.
applicability: TMPs that permit non-accredited workers to implement signs
evidence_required:
- Road speed limit, road classification, traffic volume, supervision statement
