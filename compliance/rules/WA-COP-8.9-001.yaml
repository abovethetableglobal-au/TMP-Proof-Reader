clause: §8.8–8.9 (p104)
requirement_plain: Accreditations quoted in the TMP (AWTM, RTM, etc.) must be current; Main Roads accreditations
  are valid for three years. Currency can be confirmed against the accreditation database on the Main Roads website.
applicability: All TMPs quoting accreditation numbers
evidence_required:
- Accreditation numbers (and dates, if stated) for preparer and endorser
check_method: human-only
expected_result: Reviewer confirms currency; any stated expiry is after the check date
