clause: Whole form
requirement_plain: 'Where a generic TGS is used, a site suitability assessment confirms it fits the site: activity fully covered;
  intersections/driveways; pedestrians, cyclists, public transport; nearby land uses and events; rail crossings; permanent signals;
  site features not addressed; queues. Used with the Daily Traffic Management Diary.'
applicability: TMPs that use MRWA generic TGSs (AS 1742.3 or MMS series)
evidence_required:
- suitability assessment completed or referenced
- generic TGS number and issue date match the MRWA library
check_method: presence
expected_result: Assessment present/referenced; TGS numbers valid
category: E
